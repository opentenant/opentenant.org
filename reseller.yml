# ============================================================================
# opentenant-reseller.yaml
# OpenTenant v3.0 — Canonical Delegation Blueprint
#
# This file defines the reseller tree: partners who operate their own
# OpenTenant instances on top of ours, reselling to their own tenants,
# with their own template registries, recursively.
#
# Compiler-derived properties:
#   - parent
#   - depth
#   - ancestry
#
# Explicit deployment properties:
#   - Vault namespace
#   - Kubernetes placement
#   - tenant cloud/region placement
#   - delegated template policies
# ============================================================================

---
version: "opentenant.org/v3.0"

# ----------------------------------------------------------------------------
# 0. ROOT — The Operator of Operators
# ----------------------------------------------------------------------------
root:
  id: "opentenant-core"
  domain: "opentenant.io"

  max_depth: 16

  royalty_schedule:
    - depth: 1
      keep_pct: 70
      pass_up_pct: 30

    - depth: 2
      keep_pct: 55
      pass_up_pct: 45

    - depth: "default"
      keep_pct: 50
      pass_up_pct: 50

# ----------------------------------------------------------------------------
# 1. GLOBAL TEMPLATE REGISTRY
# ----------------------------------------------------------------------------
template_registry:

  - id: "route-optimization"
    engine: "helm"
    chart: "oci://registry.opentenant.io/route-optimization"
    version: "2.2.0"

    resale:
      allowed: true
      white_label: true
      rebrand_fields:
        - "name"
        - "description"
        - "icon"
      price_floor: 149.00
      royalty_per_seat: 12.00

  - id: "driver-app"
    engine: "helm"
    chart: "oci://registry.opentenant.io/driver-api"
    version: "1.3.0"

    resale:
      allowed: true
      white_label: true
      price_floor: 4.99
      royalty_per_seat: 0.50

  - id: "fleet-maintenance"
    engine: "helm"
    chart: "oci://registry.opentenant.io/fleet-maintenance"
    version: "1.9.0"

    resale:
      allowed: false

# ----------------------------------------------------------------------------
# 2. DELEGATION TREE
#
# A node's position in `children:` determines its parent, depth and ancestry.
# ----------------------------------------------------------------------------
delegation_tree:

  # ==========================================================================
  # DEPTH 1 — Direct partner
  # ==========================================================================
  - id: "logifleet-partner"
    kind: "reseller"
    enabled: true

    brand:
      name: "LogiFleet Platform"
      domain: "*.logifleet.io"
      theme: "industrial-teal"
      support_email: "support@logifleet.io"

    vault_namespace: "opentenant/resellers/logifleet"

    kubernetes:
      cluster_pool: "shared-us-east"
      namespace_prefix: "lf-"
      resource_quotas:
        cpu: "200"
        memory: "400Gi"

    # Templates authored/published by this reseller.
    template_registry:

      - id: "lf-logistics-suite"
        engine: "helm"
        chart: "oci://registry.logifleet.io/logistics-suite"
        version: "4.0.1"

        composes:
          - template: "route-optimization"
          - template: "driver-app"

        resale:
          allowed: true
          white_label: true
          price_floor: 399.00
          royalty_per_seat: 25.00

    # Customers operated by LogiFleet.
    tenants:

      - id: "carrier-mx"
        tier: "premium"
        enabled: true

        namespace: "lf-tenant-carrier-mx"

        placement:
          cloud: "aws"
          region: "us-east-1"

        subscriptions:
          - template: "lf-logistics-suite"

        org_chart:
          - id: "operations"
            roles:
              - id: "dispatch"
                members:
                  - "disp@carrier-mx.com"

    # ========================================================================
    # DEPTH 2 — Regional partners
    # ========================================================================
    children:

      - id: "logifleet-mexico"
        kind: "reseller"
        enabled: true

        brand:
          name: "LogiFleet México"
          domain: "*.logifleet.mx"
          theme: "industrial-teal-mx"
          locale: "es-MX"

        vault_namespace: "opentenant/resellers/logifleet/children/mexico"

        kubernetes:
          cluster_pool: "shared-latam"
          namespace_prefix: "lfmx-"

        # Policies delegated to this node by LogiFleet.
        delegated_templates:

          - template: "lf-logistics-suite"
            resale:
              allowed: true
              white_label: true
              price_floor: 450.00
              royalty_per_seat: 40.00

        tenants:

          - id: "transportes-norte"
            tier: "standard"
            enabled: true

            namespace: "lfmx-tenant-transportes-norte"

            placement:
              cloud: "gcp"
              region: "us-central1"

            subscriptions:
              - template: "lf-logistics-suite"

        children: []

      # ========================================================================
      # DEPTH 2 — Reserved regional partner slot
      # ========================================================================
      - id: "logifleet-brazil"
        kind: "reseller"
        enabled: false

        brand:
          name: "LogiFleet Brazil"
          domain: "*.logifleet.com.br"
          theme: "industrial-teal-br"

        vault_namespace: "opentenant/resellers/logifleet/children/brazil"

        kubernetes:
          cluster_pool: "shared-latam"
          namespace_prefix: "lfbr-"

        children: []