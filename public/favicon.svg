<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="100%" height="100%">
<defs>
  <radialGradient id="pcb" cx="0.5" cy="0.45" r="0.75">
    <stop offset="0" stop-color="#16308a"/><stop offset="1" stop-color="#081236"/>
  </radialGradient>
  <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff3ea5"/><stop offset="0.55" stop-color="#ff8a00"/><stop offset="1" stop-color="#ffd60a"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/>
  </linearGradient>
  <pattern id="pins" width="1" height="1" patternUnits="userSpaceOnUse">
    <circle cx="0.5" cy="0.5" r="0.17" fill="#5b7bff"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="0.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect x="0.35" y="0.35" width="43.3" height="43.3" rx="8.5" fill="url(#pcb)"/>

<!-- SIGNAL TRACES -->
<g fill="none" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
  <!-- memory bus -->
  <path d="M28 16.5 H32" stroke="#22d3ee"/>
  <path d="M28 19 H32" stroke="#22d3ee"/>
  <path d="M28 21.5 H32" stroke="#22d3ee"/>
  <!-- I/O data -->
  <path d="M16.5 14 V10.5 L13.5 7.5 H11.5" stroke="#ff3ea5"/>
  <path d="M19 14 V9.5 L15.5 6 H11.5" stroke="#ff3ea5"/>
  <!-- PCIe lanes -->
  <path d="M17 28 V31.5" stroke="#ffd60a"/>
  <path d="M20 28 V31.5" stroke="#ffd60a"/>
  <path d="M23 28 V31.5" stroke="#ffd60a"/>
  <!-- power delivery -->
  <path d="M14 18 H10" stroke="#ff8a00"/>
  <path d="M14 21 H10" stroke="#ff8a00"/>
  <path d="M14 24 H10" stroke="#ff8a00"/>
  <!-- chipset -->
  <path d="M31 36.9 H25.6" stroke="#a3e635"/>
</g>

<!-- I/O PORTS -->
<rect x="5" y="5" width="6.5" height="3" rx="0.5" fill="#ff3ea5"/>
<rect x="5" y="8.8" width="6.5" height="3" rx="0.5" fill="#c026d3"/>
<rect x="6" y="5.9" width="4.5" height="1.2" rx="0.3" fill="#3b0a24"/>
<rect x="6" y="9.7" width="4.5" height="1.2" rx="0.3" fill="#3b0a24"/>

<!-- VRMs -->
<g fill="#ff8a00">
  <rect x="6.5" y="16.6" width="3.2" height="2.8" rx="0.4"/>
  <rect x="6.5" y="19.6" width="3.2" height="2.8" rx="0.4"/>
  <rect x="6.5" y="22.6" width="3.2" height="2.8" rx="0.4"/>
</g>
<g fill="#4a2300" opacity="0.45">
  <rect x="7.2" y="17.3" width="1.8" height="1.4" rx="0.2"/>
  <rect x="7.2" y="20.3" width="1.8" height="1.4" rx="0.2"/>
  <rect x="7.2" y="23.3" width="1.8" height="1.4" rx="0.2"/>
</g>


<!-- CPU SOCKET -->
<rect x="14" y="14" width="14" height="14" rx="1.4" fill="#0e1f5c" stroke="#3b5bdb" stroke-width="0.3"/>
<rect x="14.5" y="14.5" width="13" height="13" rx="1" fill="url(#pins)"/>
<rect x="16" y="16" width="10" height="10" rx="1.1" fill="url(#die)" filter="url(#glow)"/>
<rect x="16.6" y="16.6" width="8.8" height="3" rx="0.7" fill="#ffffff" opacity="0.18"/>
<polygon points="16.6,25.4 16.6,24 18,25.4" fill="#fff7cc"/>

<!-- RAM SLOTS -->
<rect x="32" y="6" width="1.4" height="24" rx="0.4" fill="#22d3ee"/>
<rect x="34.5" y="6" width="1.4" height="24" rx="0.4" fill="#ff3ea5"/>
<rect x="37" y="6" width="1.4" height="24" rx="0.4" fill="#22d3ee"/>
<g fill="#081236" opacity="0.55">
  <rect x="32.5" y="7.2" width="0.4" height="21.6"/>
  <rect x="35" y="7.2" width="0.4" height="21.6"/>
  <rect x="37.5" y="7.2" width="0.4" height="21.6"/>
</g>
<g fill="#f1f5f9">
  <rect x="31.9" y="5.6" width="1.6" height="0.8" rx="0.2"/>
  <rect x="34.4" y="5.6" width="1.6" height="0.8" rx="0.2"/>
  <rect x="36.9" y="5.6" width="1.6" height="0.8" rx="0.2"/>
</g>

<!-- PCIe SLOTS -->
<rect x="5" y="32" width="24" height="1.8" rx="0.4" fill="#0b1440" stroke="#ffd60a" stroke-width="0.45"/>
<rect x="5" y="36" width="20.6" height="1.8" rx="0.4" fill="#0b1440" stroke="#a3e635" stroke-width="0.45"/>
<rect x="11" y="31.8" width="0.5" height="2.2" fill="#081236"/>
<rect x="11" y="35.8" width="0.5" height="2.2" fill="#081236"/>

<!-- CHIPSET -->
<rect x="31" y="33" width="6" height="6" rx="0.9" fill="#a78bfa"/>
<rect x="32.2" y="34.2" width="3.6" height="3.6" rx="0.5" fill="#5b21b6"/>
</svg>